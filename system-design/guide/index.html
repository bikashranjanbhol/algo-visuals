<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System Design Components: the complete guide, Algo Visuals</title>
<meta name="description" content="System design components explained one concept at a time, with animated diagrams.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/pages.css">
<link rel="stylesheet" href="/assets/site.css">
<link rel="stylesheet" href="/assets/anim.css">
<script src="/assets/site.js" defer></script>
<script type="module" src="/assets/auth.js"></script>
<script src="/system-design/guide/specs.js"></script>
<script src="/system-design/guide/manifest.js"></script>
<script src="/assets/anim.js"></script>
<style>
/* Docs-style shell: full-width header, flush sidebar, readable content column. */
:root{--shell:none;--side-w:280px}
body{line-height:1.65}
.site-header .in{max-width:none;padding:0 24px}
.site-footer{margin-top:0}
.site-footer .in{max-width:none;padding:18px 24px;font-size:.8125rem}

.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);align-items:start;min-height:calc(100vh - 61px)}

/* ---------- sidebar ---------- */
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);padding:20px 12px 32px;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.side-back{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:500;color:var(--muted);text-decoration:none;padding:2px 8px;margin-bottom:10px}
.side-back:hover{color:var(--ink)}
.side-title{font-size:.9375rem;font-weight:600;color:var(--ink);padding:0 8px;margin:0}
.side-prog{display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);padding:0 8px;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.pbar{height:4px;background:var(--line);border-radius:4px;margin:0 8px 16px;overflow:hidden}
.pbar div{height:100%;background:var(--hit);border-radius:4px;transition:width .3s}
.search{position:relative;display:block;margin:0 4px 14px}
.search svg{position:absolute;left:10px;top:50%;width:14px;height:14px;transform:translateY(-50%);stroke:var(--muted);fill:none;stroke-width:2;pointer-events:none}
.search input{width:100%;font:inherit;font-size:.8125rem;padding:7px 10px 7px 31px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);box-shadow:var(--shadow);outline:none}
.search input:focus{border-color:var(--i);box-shadow:0 0 0 3px var(--i-soft)}
.side-link{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:.8125rem;font-weight:500;color:var(--ink-2);text-decoration:none;margin-bottom:6px}
.side-link:hover{background:var(--cell)}
.side-link[aria-current="true"]{background:var(--i-soft);color:var(--i)}
.side-link svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8}
.grp{margin-top:2px}
.grp > button{width:100%;display:flex;align-items:center;gap:8px;background:none;border:none;font:inherit;font-size:.8125rem;font-weight:600;color:var(--ink);text-align:left;padding:6px 8px;border-radius:6px;cursor:pointer;line-height:1.35}
.grp > button:hover{background:var(--cell)}
.grp > button .gname{flex:1;min-width:0}
.grp > button .n{font-size:.6875rem;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.grp > button .n.done{color:var(--hit)}
.grp > button .chev{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .15s;flex:none}
.grp.open > button .chev{transform:rotate(90deg)}
.grp ul{list-style:none;margin:2px 0 8px 15px;padding:0 0 0 8px;border-left:1px solid var(--line)}
.grp:not(.open) ul{display:none}
.grp.hide{display:none}
.grp li a,.grp li .soon{display:flex;align-items:baseline;gap:8px;padding:5px 8px;margin-left:-9px;border-left:1px solid transparent;border-radius:0 6px 6px 0;font-size:.8125rem;line-height:1.4;text-decoration:none;color:var(--ink-2)}
.grp li a:hover{color:var(--ink);background:var(--cell)}
.grp li a[aria-current="true"]{color:var(--i);font-weight:600;border-left-color:var(--i);background:var(--i-soft)}
.grp li .soon{color:var(--muted);cursor:default}
.grp .num{font-size:.6875rem;color:var(--muted);min-width:20px;font-variant-numeric:tabular-nums;flex:none}
.grp a[aria-current="true"] .num{color:var(--i)}
.grp a.done .num{color:var(--hit);font-weight:700}
.grp .t{flex:1;min-width:0}
.grp .tag{font-size:.625rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;flex:none;opacity:.8}
.side-empty{font-size:.8125rem;color:var(--muted);padding:6px 8px}

/* ---------- content ---------- */
.content{min-width:0;padding:40px clamp(20px,5vw,64px) 64px}
.doc{max-width:820px;margin:0 auto;color:var(--ink-2)}
.mbar{display:none}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:500;color:var(--muted);margin:0 0 12px;flex-wrap:wrap}
.eyebrow a{color:var(--muted);text-decoration:none}
.eyebrow a:hover{color:var(--ink)}
.eyebrow .sep{opacity:.5}
.eyebrow .here{color:var(--i)}
.doc h1,.doc .sec-title{font-size:clamp(1.75rem,3.4vw,2.25rem);font-weight:700;letter-spacing:-.025em;line-height:1.2;color:var(--ink);margin:0 0 14px;max-width:none}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:.8125rem;color:var(--muted);padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8}
.pill{font-size:.75rem;font-weight:500;padding:1px 8px;border-radius:999px;background:var(--hit-soft);color:var(--hit)}
.pill.mid{background:var(--j-soft);color:var(--j)}
.doc h2{font-size:1.375rem;font-weight:650;letter-spacing:-.015em;color:var(--ink);margin:40px 0 10px;line-height:1.3}
.doc h3{font-size:1.125rem;font-weight:600;color:var(--ink);margin:28px 0 8px}
.doc h4{font-size:1rem;font-weight:600;color:var(--ink);margin:20px 0 6px}
.doc p{max-width:68ch;margin:0 0 16px}
.doc strong{color:var(--ink);font-weight:600}
.doc ul,.doc ol{max-width:68ch;margin:0 0 18px;padding-left:1.35em}
.doc li{margin:4px 0;padding-left:2px}
.doc li::marker{color:var(--muted)}
.doc blockquote{margin:16px 0;padding:12px 16px;border:1px solid var(--line);border-left:3px solid var(--i);background:var(--cell);border-radius:8px;max-width:68ch}
.doc blockquote p{margin:0}
.doc pre{background:var(--code-bg);color:#D5DAE3;border-radius:10px;padding:14px 16px;font-family:var(--mono);font-size:.8125rem;line-height:1.6;overflow-x:auto;margin:12px 0 18px;max-width:none}
.doc pre code{background:transparent;padding:0;border:none;font-size:inherit;color:inherit}
.doc code{font-family:var(--mono);font-size:.85em;background:var(--cell);border:1px solid var(--line);padding:1px 5px;border-radius:5px;color:var(--ink)}
.doc table{width:100%;border-collapse:collapse;font-size:.875rem;margin:12px 0 20px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.doc th{text-align:left;font-weight:600;color:var(--ink);font-size:.8125rem;padding:9px 12px;background:var(--cell);border-bottom:1px solid var(--line)}
.doc td{padding:9px 12px;border-bottom:1px solid var(--line)}
.doc tr:last-child td{border-bottom:none}

/* ---------- qualities grid ---------- */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:16px 0 20px;max-width:none}
.qgrid .q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.qgrid .q b{display:block;font-size:.875rem;font-weight:600;color:var(--ink);margin-bottom:4px}
.qgrid .q span{display:block;font-size:.8125rem;line-height:1.5;color:var(--muted)}

/* ---------- quiz ---------- */
.quiz{margin:36px 0 0;border:1px solid var(--line);border-radius:12px;padding:20px 22px 18px;background:var(--surface);box-shadow:var(--shadow)}
.quiz::before{content:"Check your understanding";display:block;font-size:.6875rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--i);margin-bottom:8px}
.doc .quiz h2{font-size:1.0625rem;margin:0 0 4px}
.quiz > p{margin:0 0 14px}
.qopts{display:grid;gap:8px;margin:0 0 4px;counter-reset:opt}
.qopts button{counter-increment:opt;display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;font-size:.9rem;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;cursor:pointer;transition:border-color .12s,background .12s}
.qopts button::before{content:counter(opt,upper-alpha);display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;flex:none;border-radius:5px;border:1px solid var(--line-2);font-size:.75rem;font-weight:600;color:var(--muted)}
.qopts button:hover{border-color:var(--i);background:var(--i-soft)}
.qopts button.ok{border-color:var(--hit);background:var(--hit-soft)}
.qopts button.ok::before{content:"✓";background:var(--hit);border-color:var(--hit);color:#fff}
.qopts button.no{border-color:var(--miss);background:var(--miss-soft)}
.qopts button.no::before{content:"✕";background:var(--miss);border-color:var(--miss);color:#fff}
.qwhy{margin:12px 0 0!important;font-size:.875rem;color:var(--ink-2)}
.qwhy:empty{display:none}

/* ---------- lesson footer ---------- */
.lesson-nav{margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}
.done-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:24px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--cell)}
.done-row p{margin:0;font-size:.875rem;color:var(--muted)}
.done-row p b{display:block;color:var(--ink);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-size:.875rem;font-weight:600;border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.btn:hover{border-color:var(--muted)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2}
.btn.primary{background:#4F46E5;border-color:#4F46E5;color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.is-done{background:var(--hit-soft);border-color:var(--hit);color:var(--hit)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pager a,.pager .card{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;text-decoration:none;background:var(--surface);transition:border-color .12s}
.pager a:hover{border-color:var(--i)}
.pager small{font-size:.75rem;color:var(--muted);font-weight:500}
.pager b{font-size:.9375rem;font-weight:600;color:var(--ink)}
.pager a:hover b{color:var(--i)}
.pager .nx{grid-column:2;text-align:right}
.pager .card.soon{opacity:.65}
@media (max-width:600px){.pager{grid-template-columns:1fr}.pager .nx{grid-column:1}}

/* ---------- overview ---------- */
.lede{font-size:1.0625rem;color:var(--muted);max-width:62ch;margin:0 0 24px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:32px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:44px}
.stats div{padding:14px 18px;border-left:1px solid var(--line)}
.stats div:first-child{border-left:none}
.stats b{display:block;font-size:1.375rem;font-weight:650;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.stats span{font-size:.8125rem;color:var(--muted)}
@media (max-width:600px){.stats{grid-template-columns:1fr 1fr}.stats div:nth-child(3){border-left:none}.stats div:nth-child(n+3){border-top:1px solid var(--line)}}
.syl-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.doc .syl-h h2{margin:0}
.syl-h span{font-size:.8125rem;color:var(--muted)}
.syl{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mod{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line);text-decoration:none;color:inherit;background:var(--surface)}
.mod:first-child{border-top:none}
a.mod:hover{background:var(--cell)}
.mod .mn{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.mod b{display:block;font-size:.9375rem;font-weight:600;color:var(--ink)}
.mod small{font-size:.8125rem;color:var(--muted)}
.mod .st{font-size:.75rem;font-weight:500;color:var(--muted);white-space:nowrap}
.mod .st.go{color:var(--i)}

/* ---------- mobile: sidebar becomes a drawer ---------- */
.scrim{display:none}
@media (max-width:960px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(86vw,320px);height:auto;z-index:50;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 10px 40px rgba(0,0,0,.18)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(15,23,42,.35);z-index:40}
  body.nav-open{overflow:hidden}
  .content{padding-top:0}
  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:30;margin:0 calc(-1 * clamp(20px,5vw,64px)) 24px;padding:10px clamp(20px,5vw,64px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .mbar button{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:.8125rem;font-weight:600;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:6px 10px;cursor:pointer;flex:none}
  .mbar button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
  .mbar span{font-size:.8125rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
}
</style>
</head>
<body>
<main class="shell">
  <aside class="side" id="side" aria-label="Concepts">
    <a class="side-back" href="/system-design">← System Design</a>
    <p class="side-title">The complete guide</p>
    <div class="side-prog"><span id="prog"></span><span id="pct"></span></div>
    <div class="pbar"><div id="pbarFill"></div></div>
    <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search lessons" aria-label="Search lessons"></label>
    <a class="side-link" id="ovLink" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Overview</a>
    <div id="groups"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="content">
    <div class="mbar"><button type="button" id="navBtn" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Lessons</button><span id="mcur"></span></div>
    <article class="doc" id="doc"></article>
  </div>
</main>
<script>
const G = window.GUIDE, $ = id => document.getElementById(id);
const all = G.groups.flatMap(g => g.items), ready = all.filter(i => i.ready);
const groupOf = id => G.groups.find(g => g.items.some(i => i.id === id));
const strip = t => t.replace(/^\d+\.\s*/, '');
const numOf = it => all.indexOf(it) + 1;
let cur = null, filter = '';
const DONE_KEY = 'sd-guide-done';
const done = new Set((() => { try { return JSON.parse(localStorage.getItem(DONE_KEY) || '[]'); } catch { return []; } })());
const saveDone = () => { try { localStorage.setItem(DONE_KEY, JSON.stringify([...done])); } catch {} };
const ICON = {
  chev: '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
  clock: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  book: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/></svg>',
  check: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>'
};

function setNav(open){ document.body.classList.toggle('nav-open', open); $('navBtn').setAttribute('aria-expanded', open); }
$('navBtn').onclick = () => setNav(true);
$('scrim').onclick = () => setNav(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape') setNav(false); });

function renderSide(){
  const n = done.size, pct = Math.round(n / all.length * 100);
  $('prog').textContent = `${n} of ${all.length} complete`;
  $('pct').textContent = pct + '%';
  $('pbarFill').style.width = pct + '%';
  $('ovLink').toggleAttribute('aria-current', cur === null);
  if (cur === null) $('ovLink').setAttribute('aria-current', 'true');
  const q = filter.trim().toLowerCase();
  const open = g => q ? true : (g.items.some(i => i.id === cur) || (cur === null && g === G.groups[0]));
  const html = G.groups.map(g => {
    const items = g.items.filter(i => !q || i.title.toLowerCase().includes(q) || g.group.toLowerCase().includes(q));
    if (!items.length) return '';
    const d = g.items.filter(i => done.has(i.id)).length, full = d === g.items.length;
    return `<div class="grp ${open(g) ? 'open' : ''}"><button type="button" aria-expanded="${open(g)}"><span class="gname">${g.group}</span><span class="n ${full ? 'done' : ''}">${d}/${g.items.length}</span>${ICON.chev}</button><ul>${items.map(i => {
      const num = done.has(i.id) ? '✓' : numOf(i);
      return i.ready
        ? `<li><a href="#${i.id}" data-id="${i.id}" class="${done.has(i.id) ? 'done' : ''}" ${i.id === cur ? 'aria-current="true"' : ''}><span class="num">${num}</span><span class="t">${strip(i.title)}</span></a></li>`
        : `<li><span class="soon"><span class="num">${num}</span><span class="t">${strip(i.title)}</span><span class="tag">Soon</span></span></li>`;
    }).join('')}</ul></div>`;
  }).join('');
  $('groups').innerHTML = html || '<p class="side-empty">No lessons match.</p>';
  $('groups').querySelectorAll('.grp > button').forEach(b => b.onclick = () => { const o = b.parentElement.classList.toggle('open'); b.setAttribute('aria-expanded', o); });
  $('groups').querySelectorAll('li a').forEach(a => a.onclick = e => { e.preventDefault(); setNav(false); go(a.dataset.id, true); });
}
$('search').addEventListener('input', e => { filter = e.target.value; renderSide(); });
$('ovLink').onclick = e => { e.preventDefault(); setNav(false); history.replaceState(null, '', location.pathname); showIntro(); window.scrollTo(0, 0); };

function wireQuiz(doc){
  doc.querySelectorAll('.quiz').forEach(qz => { const why = qz.querySelector('.qwhy'); qz.querySelectorAll('.qopts button').forEach(b => b.onclick = () => { qz.querySelectorAll('.qopts button').forEach(x => x.classList.remove('ok','no')); b.classList.add(b.dataset.ok === '1' ? 'ok' : 'no'); why.innerHTML = `<b>${b.dataset.ok === '1' ? 'Correct.' : 'Not quite.'}</b> ${b.dataset.why}`; }); });
}
function wireLinks(root){ root.querySelectorAll('a[data-id]').forEach(a => a.onclick = e => { e.preventDefault(); if (a.dataset.complete) { done.add(a.dataset.complete); saveDone(); } go(a.dataset.id, true); }); }
function toTop(){ const c = document.querySelector('.content'); if (c.getBoundingClientRect().top < 0) c.scrollIntoView({ block: 'start' }); }

async function go(id, scroll){
  cur = id; history.replaceState(null, '', '#' + id); renderSide();
  const doc = $('doc'); doc.innerHTML = '<p style="color:var(--muted)">Loading…</p>';
  const item = all.find(x => x.id === id), idx = all.indexOf(item), grp = groupOf(id);
  $('mcur').textContent = strip(item.title);
  document.title = `${strip(item.title)} · System Design guide · Algo Visuals`;
  try { const r = await fetch(`/system-design/guide/sections/${id}.html`); if (!r.ok) throw 0; doc.innerHTML = await r.text(); }
  catch { doc.innerHTML = `<h1 class="sec-title">${item.title}</h1><p>This lesson is not built yet.</p>`; }
  const h1 = doc.querySelector('.sec-title');
  if (h1) h1.textContent = strip(h1.textContent);
  const level = idx < 8 ? '<span class="pill">Beginner</span>' : '<span class="pill mid">Intermediate</span>';
  const head = `<div class="eyebrow"><a href="#" id="crumbOv">Complete guide</a><span class="sep">/</span><span>${grp.group}</span><span class="sep">/</span><span class="here">Lesson ${idx + 1}</span></div>`;
  const meta = `<div class="meta"><span>${ICON.book}Lesson ${idx + 1} of ${all.length}</span><span>${ICON.clock}${item.min} min read</span>${level}</div>`;
  if (h1) { h1.insertAdjacentHTML('beforebegin', head); h1.insertAdjacentHTML('afterend', meta); } else doc.insertAdjacentHTML('afterbegin', head + meta);
  $('crumbOv').onclick = e => { e.preventDefault(); $('ovLink').click(); };

  const i = ready.findIndex(x => x.id === id), prev = ready[i - 1], next = ready[i + 1], upcoming = all[idx + 1];
  const isDone = done.has(id);
  const prevHtml = prev ? `<a href="#${prev.id}" data-id="${prev.id}"><small>← Previous</small><b>${strip(prev.title)}</b></a>` : '';
  const nextHtml = next ? `<a class="nx" href="#${next.id}" data-id="${next.id}" data-complete="${id}"><small>Next →</small><b>${strip(next.title)}</b></a>`
    : upcoming ? `<div class="card nx soon"><small>Up next · coming soon</small><b>${strip(upcoming.title)}</b></div>` : '';
  doc.insertAdjacentHTML('beforeend', `<div class="lesson-nav"><div class="done-row"><p><b>${isDone ? 'Lesson complete' : 'Finished this lesson?'}</b>${isDone ? 'It counts toward your progress in the sidebar.' : 'Mark it complete to track your progress.'}</p><button type="button" class="btn ${isDone ? 'is-done' : 'primary'}" id="markDone">${ICON.check}${isDone ? 'Completed' : 'Mark as complete'}</button></div><nav class="pager" aria-label="Lessons">${prevHtml}${nextHtml}</nav></div>`);
  wireLinks(doc);
  $('markDone').onclick = () => { if (done.has(id)) done.delete(id); else done.add(id); saveDone(); go(id, false); };
  wireQuiz(doc);
  window.ANIM && window.ANIM.mountAll(doc);
  if (scroll) toTop();
}

function showIntro(){
  cur = null; renderSide();
  $('mcur').textContent = 'Overview';
  document.title = 'System Design Components: the complete guide, Algo Visuals';
  const mins = all.reduce((a, i) => a + i.min, 0);
  const resume = ready.find(i => !done.has(i.id)) || ready[0];
  const started = ready.some(i => done.has(i.id));
  const mods = G.groups.map((g, k) => {
    const r = g.items.filter(i => i.ready), d = g.items.filter(i => done.has(i.id)).length;
    const m = g.items.reduce((a, i) => a + i.min, 0);
    const st = r.length ? (d ? `${d}/${g.items.length} done` : 'Start →') : 'Coming soon';
    const inner = `<span class="mn">${String(k + 1).padStart(2, '0')}</span><span><b>${g.group}</b><small>${g.items.length} lesson${g.items.length > 1 ? 's' : ''} · ${m} min</small></span><span class="st ${r.length ? 'go' : ''}">${st}</span>`;
    return r.length ? `<a class="mod" href="#${r[0].id}" data-id="${r[0].id}">${inner}</a>` : `<div class="mod">${inner}</div>`;
  }).join('');
  $('doc').innerHTML = `<div class="eyebrow"><a href="/system-design">System Design</a><span class="sep">/</span><span class="here">Complete guide</span></div>
    <h1>System Design Components Explained</h1>
    <p class="lede">A guided course through the building blocks of large systems, from DNS and load balancers to sharding, queues and multi-region failover. Each lesson pairs a short explanation with an animated diagram you can step through.</p>
    ${resume ? `<div class="cta"><a class="btn primary" href="#${resume.id}" data-id="${resume.id}">${started ? 'Continue' : 'Start the course'}${ICON.arrow}</a><a class="btn" href="#syllabus" id="toSyl">View syllabus</a></div>` : ''}
    <div class="stats"><div><b>${all.length}</b><span>Lessons</span></div><div><b>${G.groups.length}</b><span>Modules</span></div><div><b>~${Math.round(mins / 60)} h</b><span>Reading time</span></div><div><b>${ready.length}</b><span>Available now</span></div></div>
    ${G.intro ? `<div class="intro">${G.intro}</div>` : ''}
    <div class="syl-h" id="syllabus"><h2>Syllabus</h2><span>New lessons are added regularly</span></div>
    <div class="syl">${mods}</div>`;
  wireLinks($('doc'));
  const ts = $('toSyl'); if (ts) ts.onclick = e => { e.preventDefault(); $('syllabus').scrollIntoView({ behavior: 'smooth' }); };
}

const h = location.hash.replace('#', '');
if (h && ready.some(x => x.id === h)) go(h, false); else showIntro();
window.addEventListener('hashchange', () => { const k = location.hash.replace('#', ''); if (k && ready.some(x => x.id === k) && k !== cur) go(k, false); });
</script>
</body>
</html>
