<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<rect width="960" height="540" fill="#F7F8FB"/>
<text x="48" y="64" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="30" font-weight="800" fill="#18202E">What to cache, and for how long</text>
<text x="48" y="96" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="17" fill="#5B6577">Cache what is read often and written rarely</text>
<rect x="60" y="170" width="260" height="90" rx="14" fill="#D6F2E5" stroke="#14875C" stroke-width="2.5"/><text x="190.0" y="215.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" font-weight="700" fill="#18202E">Hot, rarely changing</text><text x="190.0" y="239.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="14" fill="#5B6577">product pages, profiles</text><rect x="350" y="170" width="260" height="90" rx="14" fill="#D6F2E5" stroke="#14875C" stroke-width="2.5"/><text x="480.0" y="215.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" font-weight="700" fill="#18202E">Expensive to compute</text><text x="480.0" y="239.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="14" fill="#5B6577">aggregates, rankings</text><rect x="640" y="170" width="260" height="90" rx="14" fill="#F8DDE0" stroke="#C2414F" stroke-width="2.5"/><text x="770.0" y="215.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" font-weight="700" fill="#18202E">Changes every second</text><text x="770.0" y="239.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="14" fill="#5B6577">live balances</text><text x="48" y="330" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" fill="#5B6577">Give every entry a TTL so stale data expires on its own. Evict with LRU when memory fills up.</text><text x="48" y="370" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" fill="#5B6577">Invalidate on write when being stale is not acceptable.</text>
</svg>