t-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" font-weight="700" fill="#18202E">Database</text><text x="48" y="420" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" fill="#5B6577">Walk one read and one write through it. If a box does nothing in either trace, delete it.</text>
