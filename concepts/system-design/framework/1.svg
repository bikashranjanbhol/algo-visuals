<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<rect width="960" height="540" fill="#F7F8FB"/>
<text x="48" y="64" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="30" font-weight="800" fill="#18202E">A framework for any system design</text>
<text x="48" y="96" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="17" fill="#5B6577">Seven steps, 45 minutes</text>
<rect x="48" y="200" width="118" height="110" rx="14" fill="#E3E6FB" stroke="#4B57D1" stroke-width="2"/><text x="107" y="262" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="15" font-weight="700" fill="#18202E">1 Requirements</text><rect x="176" y="200" width="118" height="110" rx="14" fill="#E3E6FB" stroke="#4B57D1" stroke-width="2"/><text x="235" y="262" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="15" font-weight="700" fill="#18202E">2 Numbers</text><rect x="304" y="200" width="118" height="110" rx="14" fill="#E3E6FB" stroke="#4B57D1" stroke-width="2"/><text x="363" y="262" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="15" font-weight="700" fill="#18202E">3 API</text><rect x="432" y="200" width="118" height="110" rx="14" fill="#E3E6FB" stroke="#4B57D1" stroke-width="2"/><text x="491" y="262" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="15" font-weight="700" fill="#18202E">4 Data</text><rect x="560" y="200" width="118" height="110" rx="14" fill="#D6F2E5" stroke="#14875C" stroke-width="2"/><text x="619" y="262" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="15" font-weight="700" fill="#18202E">5 Simplest design</text><rect x="688" y="200" width="118" height="110" rx="14" fill="#D6F2E5" stroke="#14875C" stroke-width="2"/><text x="747" y="262" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="15" font-weight="700" fill="#18202E">6 Break & fix</text><rect x="816" y="200" width="118" height="110" rx="14" fill="#D6F2E5" stroke="#14875C" stroke-width="2"/><text x="875" y="262" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="15" font-weight="700" fill="#18202E">7 Trade-offs</text><text x="48" y="400" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" fill="#5B6577">Requirements and numbers come before any box. Draw the simplest thing, then break it with the numbers.</text>
</svg>