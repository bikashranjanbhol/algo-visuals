t-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" font-weight="700" fill="#18202E">Database</text><rect x="480" y="120" width="150" height="60" rx="14" fill="#D6F2E5" stroke="#14875C" stroke-width="2.5"/><text x="555.0" y="150.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" font-weight="700" fill="#18202E">Cache</text><text x="555.0" y="174.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="14" fill="#5B6577">hot reads</text><defs><marker id="m7815" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 10 5 0 10z" fill="#14875C"/></marker></defs><line x1="555" y1="230" x2="555" y2="180" stroke="#14875C" stroke-width="2.5" marker-end="url(#m7815)"/><rect x="690" y="120" width="160" height="60" rx="14" fill="#D6F2E5" stroke="#14875C" stroke-width="2.5"/><text x="770.0" y="157.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" font-weight="700" fill="#18202E">Read replicas</text><defs><marker id="m2256" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 10 5 0 10z" fill="#14875C"/></marker></defs><line x1="770" y1="230" x2="770" y2="180" stroke="#14875C" stroke-width="2.5" marker-end="url(#m2256)"/><rect x="480" y="370" width="150" height="60" rx="14" fill="#D6F2E5" stroke="#14875C" stroke-width="2.5"/><text x="555.0" y="400.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" font-weight="700" fill="#18202E">Queue</text><text x="555.0" y="424.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="14" fill="#5B6577">async work</text><defs><marker id="m6285" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 10 5 0 10z" fill="#14875C"/></marker></defs><line x1="555" y1="300" x2="555" y2="370" stroke="#14875C" stroke-width="2.5" marker-end="url(#m6285)"/><text x="48" y="480" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="18" fill="#5B6577">Each green box removes one bottleneck: cache for repeated reads, replicas for read volume, queue for spikes.</text>
