<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<rect width="960" height="540" fill="#F7F8FB"/>
<text x="48" y="64" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="30" font-weight="800" fill="#18202E">A node: a value and a pointer</text>
<text x="48" y="96" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="17" fill="#5B6577">The building block</text>
<rect x="330" y="200" width="300" height="130" rx="20" fill="#fff" stroke="#4B57D1" stroke-width="3"/><line x1="470" y1="215" x2="470" y2="315" stroke="#4B57D1" stroke-width="2"/><text x="400" y="285" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="56" font-weight="800" fill="#4B57D1">2</text><text x="400" y="225" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="14" fill="#5B6577">val</text><text x="550" y="225" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="14" fill="#5B6577">next</text><text x="550" y="278" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" fill="#18202E">→ next node</text><text x="48" y="420" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" fill="#5B6577">Each node holds one value and the address of the node after it. The last node points to null.</text>
</svg>