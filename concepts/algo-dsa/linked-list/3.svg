<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<rect width="960" height="540" fill="#F7F8FB"/>
<text x="48" y="64" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="30" font-weight="800" fill="#18202E">Walking the list</text>
<text x="48" y="96" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="17" fill="#5B6577">while (cur) { ...; cur = cur.next; }</text>
<rect x="120" y="230" width="110" height="70" rx="14" fill="#fff" stroke="#4B57D1" stroke-width="3"/><line x1="176" y1="240" x2="176" y2="290" stroke="#4B57D1" stroke-width="2"/><text x="148" y="276" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="30" font-weight="800" fill="#4B57D1">2</text><text x="203" y="260" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="12" fill="#5B6577">next</text><circle cx="203" cy="278" r="5" fill="#5B6577"/><defs><marker id="m9736" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5B6577"/></marker></defs><line x1="208" y1="278" x2="270" y2="265" stroke="#5B6577" stroke-width="2.5" marker-end="url(#m9736)"/><rect x="270" y="230" width="110" height="70" rx="14" fill="#FBEFD3" stroke="#B97C06" stroke-width="3"/><line x1="326" y1="240" x2="326" y2="290" stroke="#4B57D1" stroke-width="2"/><text x="298" y="276" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="30" font-weight="800" fill="#4B57D1">4</text><text x="353" y="260" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="12" fill="#5B6577">next</text><circle cx="353" cy="278" r="5" fill="#5B6577"/><defs><marker id="m4175" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5B6577"/></marker></defs><line x1="358" y1="278" x2="420" y2="265" stroke="#5B6577" stroke-width="2.5" marker-end="url(#m4175)"/><rect x="420" y="230" width="110" height="70" rx="14" fill="#fff" stroke="#4B57D1" stroke-width="3"/><line x1="476" y1="240" x2="476" y2="290" stroke="#4B57D1" stroke-width="2"/><text x="448" y="276" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="30" font-weight="800" fill="#4B57D1">3</text><text x="503" y="260" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="12" fill="#5B6577">next</text><circle cx="503" cy="278" r="5" fill="#5B6577"/><defs><marker id="m6440" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5B6577"/></marker></defs><line x1="508" y1="278" x2="570" y2="265" stroke="#5B6577" stroke-width="2.5" marker-end="url(#m6440)"/><text x="578" y="272" font-family='JetBrains Mono, Menlo, monospace' font-size="18" fill="#5B6577">null</text><path d="M325 215 l-14 -24 h28 z" fill="#B97C06"/><text x="325" y="180" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="18" font-weight="600" fill="#B97C06">cur</text><text x="48" y="440" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" fill="#5B6577">cur = cur.next moves one node forward. The loop ends when cur becomes null.</text>
</svg>