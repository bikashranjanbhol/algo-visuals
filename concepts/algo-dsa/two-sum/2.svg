<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<rect width="960" height="540" fill="#F7F8FB"/>
<text x="48" y="64" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="30" font-weight="800" fill="#18202E">Brute force: check every pair</text>
<text x="48" y="96" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="17" fill="#5B6577">nums = [4, 5, 1, 7, 2], target = 3</text>
<rect x="260" y="220" width="76" height="76" rx="14" fill="#E3E6FB" stroke="#4B57D1" stroke-width="3"/><text x="298.0" y="270.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="34" font-weight="800" fill="#18202E">4</text><text x="298.0" y="322" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="14" fill="#5B6577">0</text><rect x="346" y="220" width="76" height="76" rx="14" fill="#FBEFD3" stroke="#B97C06" stroke-width="3"/><text x="384.0" y="270.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="34" font-weight="800" fill="#18202E">5</text><text x="384.0" y="322" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="14" fill="#5B6577">1</text><rect x="432" y="220" width="76" height="76" rx="14" fill="#fff" stroke="#D5DBE5" stroke-width="3"/><text x="470.0" y="270.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="34" font-weight="800" fill="#18202E">1</text><text x="470.0" y="322" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="14" fill="#5B6577">2</text><rect x="518" y="220" width="76" height="76" rx="14" fill="#fff" stroke="#D5DBE5" stroke-width="3"/><text x="556.0" y="270.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="34" font-weight="800" fill="#18202E">7</text><text x="556.0" y="322" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="14" fill="#5B6577">3</text><rect x="604" y="220" width="76" height="76" rx="14" fill="#fff" stroke="#D5DBE5" stroke-width="3"/><text x="642.0" y="270.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="34" font-weight="800" fill="#18202E">2</text><text x="642.0" y="322" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="14" fill="#5B6577">4</text><path d="M298 342 l-14 24 h28 z" fill="#4B57D1"/><text x="298" y="388" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="18" font-weight="600" fill="#4B57D1">i</text><path d="M384 342 l-14 24 h28 z" fill="#B97C06"/><text x="384" y="388" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="18" font-weight="600" fill="#B97C06">j</text><text x="48" y="440" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" fill="#5B6577">4 + 5 = 9, not 3. Move j right. When j runs out, move i and restart j at i + 1.</text><text x="48" y="476" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" fill="#C2414F">Every pair gets checked: n(n−1)/2 comparisons, O(n²).</text>
</svg>