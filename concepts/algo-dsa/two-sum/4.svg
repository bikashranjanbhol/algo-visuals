<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
<rect width="960" height="540" fill="#F7F8FB"/>
<text x="48" y="64" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="30" font-weight="800" fill="#18202E">One pass with a hash map</text>
<text x="48" y="96" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="17" fill="#5B6577">Remember what you've passed; ask the map for the partner</text>
<rect x="60" y="220" width="76" height="76" rx="14" fill="#fff" stroke="#D5DBE5" stroke-width="3"/><text x="98.0" y="270.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="34" font-weight="800" fill="#18202E">4</text><text x="98.0" y="322" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="14" fill="#5B6577">0</text><rect x="146" y="220" width="76" height="76" rx="14" fill="#fff" stroke="#D5DBE5" stroke-width="3"/><text x="184.0" y="270.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="34" font-weight="800" fill="#18202E">5</text><text x="184.0" y="322" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="14" fill="#5B6577">1</text><rect x="232" y="220" width="76" height="76" rx="14" fill="#D6F2E5" stroke="#14875C" stroke-width="3"/><text x="270.0" y="270.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="34" font-weight="800" fill="#18202E">1</text><text x="270.0" y="322" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="14" fill="#5B6577">2</text><rect x="318" y="220" width="76" height="76" rx="14" fill="#fff" stroke="#D5DBE5" stroke-width="3"/><text x="356.0" y="270.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="34" font-weight="800" fill="#18202E">7</text><text x="356.0" y="322" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="14" fill="#5B6577">3</text><rect x="404" y="220" width="76" height="76" rx="14" fill="#FBEFD3" stroke="#B97C06" stroke-width="3"/><text x="442.0" y="270.0" text-anchor="middle" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="34" font-weight="800" fill="#18202E">2</text><text x="442.0" y="322" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="14" fill="#5B6577">4</text><path d="M442 342 l-14 24 h28 z" fill="#B97C06"/><text x="442" y="388" text-anchor="middle" font-family='JetBrains Mono, Menlo, monospace' font-size="18" font-weight="600" fill="#B97C06">i</text><rect x="620" y="160" width="290" height="250" rx="16" fill="#fff" stroke="#D5DBE5" stroke-width="2.5"/><text x="640" y="192" font-family='JetBrains Mono, Menlo, monospace' font-size="16" font-weight="600" fill="#5B6577">seen: number → index</text><rect x="640" y="206" width="250" height="38" rx="10" fill="#E3E6FB"/><text x="660" y="232" font-family='JetBrains Mono, Menlo, monospace' font-size="18" font-weight="600" fill="#18202E">4  →  0</text><rect x="640" y="252" width="250" height="38" rx="10" fill="#E3E6FB"/><text x="660" y="278" font-family='JetBrains Mono, Menlo, monospace' font-size="18" font-weight="600" fill="#18202E">5  →  1</text><rect x="640" y="298" width="250" height="38" rx="10" fill="#D6F2E5"/><text x="660" y="324" font-family='JetBrains Mono, Menlo, monospace' font-size="18" font-weight="600" fill="#18202E">1  →  2</text><rect x="640" y="344" width="250" height="38" rx="10" fill="#E3E6FB"/><text x="660" y="370" font-family='JetBrains Mono, Menlo, monospace' font-size="18" font-weight="600" fill="#18202E">7  →  3</text><text x="48" y="440" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" fill="#5B6577">At i = 4: need 3 − 2 = 1. Is 1 in seen? Yes, at index 2. Return [2, 4].</text><text x="48" y="476" font-family='Bricolage Grotesque, Segoe UI, sans-serif' font-size="20" fill="#14875C">Each number is looked up once and stored once: O(n) time, O(n) space.</text>
</svg>